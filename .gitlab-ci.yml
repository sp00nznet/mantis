# ============================================================================
#  Mantis — GitLab CI/CD
# ============================================================================
#  Builds Mantis on three shell runners (windows / linux / macos) and ships:
#    • CLI single-exe   via Node 22 SEA  →  mantis(.exe)
#    • Desktop installer via electron-builder
#         windows: NSIS + portable .exe
#         linux:   AppImage + .deb
#         macos:   .dmg (unsigned)
#
#  Releases land on an SMB share at:
#      \\$SMB_HOST\$SMB_SHARE\mantis\$CI_COMMIT_REF_SLUG\
#  Same pattern as the Tachyon pipeline.
#
#  ── One-time setup per runner ──────────────────────────────────────────────
#  All runners: Node 22 LTS installed machine-wide and on the service
#  account's PATH.
#
#  Windows: PowerShell 5.1+ (default), gitlab-runner registered with
#    `--executor shell --shell pwsh`. NSIS 3.x for the CLI installer:
#      winget install NSIS.NSIS         (or `choco install nsis`)
#    Tag: windows, win10, shell.
#  macOS:   Xcode CLT (`xcode-select --install`). Tag: macos, darwin, shell.
#  Linux:   `dpkg fakeroot` (+ `rpm` if you add .rpm later). Tag: linux,
#           debian, shell.
#
#  Required CI/CD variables (Settings → CI/CD → Variables, masked):
#      SMB_HOST       host or IP of the release SMB server
#      SMB_SHARE      share name (e.g. releases)
#      SMB_USER       service account username
#      SMB_PASSWORD   masked CI/CD variable holding the password
#  Without these the deploy job will fail; delete it if you don't have a share.
# ============================================================================

stages:
  - bootstrap
  - build
  - test
  - package
  - deploy

variables:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # electron-builder downloads its electron + nsis binaries from this mirror.
  # The Debian runner can't reach GitHub releases reliably (hung for 11+ min on
  # electron-v33.4.11-linux-x64.zip), so we point at npmmirror's CDN which
  # mirrors every release. macOS/Windows runners are fine either way.
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_MIRROR: "https://registry.npmmirror.com/-/binary/electron/"
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://registry.npmmirror.com/-/binary/electron-builder-binaries/"

# Run on MR pipelines (build + package, but skip deploy via rules below) and on
# branch pipelines (push to main/master). Tags also trigger.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# Cache the npm download cache between jobs of the same pipeline. Each runner
# has its own cache scope so cross-OS caches don't conflict.
.npm_cache: &npm_cache
  cache:
    key: "$CI_COMMIT_REF_SLUG-$CI_JOB_STAGE-$CI_RUNNER_TAGS"
    paths:
      - .npm/

# ─── bootstrap ──────────────────────────────────────────────────────────────
# Two manual jobs you run ONCE to populate the debian-runner's electron cache
# when its egress is restricted (can't reach github.com or npmmirror.com).
# Symptom: package:desktop:linux hangs forever on `npm install` at electron's
# postinstall. Fix:
#
#   1. Trigger `bootstrap:prepare-electron-cache` from the GitLab web UI
#      (Pipelines → Run pipeline). It runs on the macOS runner (which CAN
#      reach GitHub) and uploads electron-cache-bundle.tar.gz as an artifact.
#
#   2. Trigger `bootstrap:install-electron-cache`. It runs on the debian
#      runner, pulls the artifact from Job 1, and extracts it into
#      ~/.cache/electron and ~/.cache/electron-builder. From then on,
#      every desktop:linux build skips the network download.
#
# Re-run both jobs whenever desktop/package.json bumps electron's version.

# ─── Artifact size note ─────────────────────────────────────────────────────
# The bundle is ~103 MB (Electron itself is ~101 MB compressed). GitLab CE's
# default max_artifacts_size is 100 MB → 413 Payload Too Large on upload.
# Bump it BEFORE running these jobs:
#
#   Admin Area → Settings → CI/CD → Continuous Integration and Deployment
#   → Maximum artifacts size (MB):  bump 100 → 500
#
# Or by API:
#   curl --request PUT --header "PRIVATE-TOKEN: <admin-token>" \
#     "https://buildforever.cloud/api/v4/application/settings?max_artifacts_size=500"
#
# That bump also unblocks future fat releases (DMG, AppImage, big EXEs).

bootstrap:prepare-electron-cache:
  stage: bootstrap
  tags: [macos, darwin, shell]
  # Only exists in web-triggered pipelines. On push/MR pipelines this job is
  # not created, so the `bootstrap` stage is empty and the regular build →
  # test → package → deploy flow starts immediately.
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
  needs: []
  script:
    - bash scripts/runner-electron-cache.sh prepare
    - ls -lh electron-cache-bundle.tar.gz
  artifacts:
    name: "electron-cache-bundle"
    paths:
      - electron-cache-bundle.tar.gz
    expire_in: 30 days

bootstrap:install-electron-cache:
  stage: bootstrap
  tags: [linux, debian, shell]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
  needs:
    - job: bootstrap:prepare-electron-cache
      artifacts: true
  script:
    - ls -lh electron-cache-bundle.tar.gz
    - bash scripts/runner-electron-cache.sh install electron-cache-bundle.tar.gz
    - rm -f electron-cache-bundle.tar.gz
    - echo "Cache populated. Next desktop:linux build will skip the GitHub download."

# ─── build ──────────────────────────────────────────────────────────────────
# Install root + desktop deps. Verifies tree resolves on every push.

.build_base:
  stage: build
  <<: *npm_cache
  # Build stage just verifies the root tree resolves. Desktop's npm install
  # triggers a 100 MB Electron binary download which we'd otherwise pay for
  # twice (here + in package); defer it to the package:desktop:* jobs.
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  script:
    - node --version
    - npm --version
    - npm install --no-audit --no-fund

build:windows:
  extends: .build_base
  tags: [windows, win10, shell]

build:linux:
  extends: .build_base
  tags: [linux, debian, shell]

build:macos:
  extends: .build_base
  tags: [macos, darwin, shell]

# ─── test ───────────────────────────────────────────────────────────────────
# Lightweight smoke test — just make sure every src/* file parses, the SEA
# bundle command works in dry-run, and the CLI prints its help. We use Linux
# for this because it's the cheapest minute.
test:smoke:
  stage: test
  tags: [linux, debian, shell]
  needs:
    - job: build:linux
      artifacts: false
  <<: *npm_cache
  script:
    - npm install --no-audit --no-fund
    # All modules import without errors:
    - |
      node -e "
      Promise.all([
        import('./src/config.js'),
        import('./src/cli.js'),
        import('./src/agent.js'),
        import('./src/swarm.js'),
        import('./src/generate.js'),
        import('./src/headless.js'),
        import('./src/admin.js'),
        import('./src/proxy.js'),
      ]).then(() => console.log('all modules OK')).catch(e => { console.error(e); process.exit(1); });
      "
    # CLI help renders:
    - node bin/mantis.js help
    # Run any tests/ if present (no-op when the dir is empty):
    - if [ -d tests ]; then node --test tests/ ; else echo 'no tests dir, skipping' ; fi

# ─── package ────────────────────────────────────────────────────────────────
# Two jobs per OS: CLI SEA exe + desktop installer. Each writes its output to
# releases/<os>/ so the deploy job can grab everything from a single tree.

.package_cli_base:
  stage: package
  <<: *npm_cache

package:cli:windows:
  extends: .package_cli_base
  tags: [windows, win10, shell]
  needs:
    - job: build:windows
      artifacts: false
  script:
    - npm install --no-audit --no-fund
    - npm run build:sea
    - npm run build:installer
    - New-Item -ItemType Directory -Force -Path releases/windows | Out-Null
    - |
      $zip = "releases/Mantis-CLI-windows-x64-$env:CI_COMMIT_SHORT_SHA.zip"
      if (Test-Path $zip) { Remove-Item -Force $zip }
      Compress-Archive -Path dist/release/* -DestinationPath $zip
    - Move-Item -Force dist/Mantis-CLI-Setup-*.exe releases/windows/
    - "$('{0:N1}' -f ((Get-Item $zip).Length / 1MB)) + ' MB zip'"
    - Get-ChildItem releases/windows
  artifacts:
    name: "mantis-cli-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - releases/Mantis-CLI-windows-x64-*.zip
      - releases/windows/Mantis-CLI-Setup-*.exe
    expire_in: 30 days

package:cli:linux:
  extends: .package_cli_base
  # Cross-built on the macOS runner. The debian-runner doesn't have enough
  # RAM for postject to inject the SEA blob (8 min slow grind then OOM kill).
  # postject is platform-agnostic — it patches ELF/Mach-O/PE sections from
  # any host — and TARGET_PLATFORM=linux makes build-sea.mjs download the
  # linux Node 22 binary and use that as the embedded runtime in the final
  # exe. The .deb installer is also produced here via dpkg-deb on macOS
  # (or skipped if dpkg-deb isn't present — see installer script).
  tags: [macos, darwin, shell]
  needs:
    - job: build:macos
      artifacts: false
  variables:
    TARGET_PLATFORM: "linux"
    TARGET_ARCH: "x64"
  script:
    - npm install --no-audit --no-fund
    - npm run build:sea
    # Skip the native installer step on macOS — dpkg-deb isn't there. The
    # CLI .deb can be built on a separate linux job (or locally) when needed.
    - mkdir -p releases/linux
    - tar -C dist/release -czf "releases/Mantis-CLI-linux-x64-$CI_COMMIT_SHORT_SHA.tar.gz" .
    - ls -lh releases/
  artifacts:
    name: "mantis-cli-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - releases/Mantis-CLI-linux-x64-*.tar.gz
    expire_in: 30 days

package:cli:macos:
  extends: .package_cli_base
  tags: [macos, darwin, shell]
  needs:
    - job: build:macos
      artifacts: false
  script:
    - npm install --no-audit --no-fund
    - npm run build:sea
    - npm run build:installer
    - mkdir -p releases/macos
    - tar -C dist/release -czf "releases/Mantis-CLI-macos-$CI_COMMIT_SHORT_SHA.tar.gz" .
    - mv dist/Mantis-CLI-*.pkg releases/macos/
    - ls -lh releases/ releases/macos/
  artifacts:
    name: "mantis-cli-macos-$CI_COMMIT_SHORT_SHA"
    paths:
      - releases/Mantis-CLI-macos-*.tar.gz
      - releases/macos/Mantis-CLI-*.pkg
    expire_in: 30 days

# ─── desktop installers (electron-builder per OS) ───────────────────────────

.package_desktop_base:
  stage: package
  <<: *npm_cache

package:desktop:windows:
  extends: .package_desktop_base
  tags: [windows, win10, shell]
  needs:
    - job: build:windows
      artifacts: false
  script:
    - cd desktop
    - npm install --no-audit --no-fund
    - npm run dist:win
    - cd ..
    - New-Item -ItemType Directory -Force -Path releases/windows | Out-Null
    # Move (not copy) to avoid doubling the artifact size.
    - Move-Item -Force desktop/dist/*.exe releases/windows/
    - Get-ChildItem releases/windows
  artifacts:
    name: "mantis-desktop-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - releases/windows/*.exe
    expire_in: 30 days

package:desktop:linux:
  extends: .package_desktop_base
  tags: [linux, debian, shell]
  needs:
    - job: build:linux
      artifacts: false
  # Manual until the bootstrap pipeline has been played to seed
  # ~/.cache/electron on the debian-runner. Without that cache, this job
  # hangs forever on electron's GitHub download and starves
  # package:cli:linux of RAM (postject OOMs). Run on-demand once you've
  # confirmed the cache is there.
  rules:
    - when: manual
      allow_failure: true
  script:
    - cd desktop
    - npm install --no-audit --no-fund
    - npm run dist:linux
    - cd ..
    - mkdir -p releases/linux
    - mv desktop/dist/*.AppImage releases/linux/ 2>/dev/null || true
    - mv desktop/dist/*.deb      releases/linux/ 2>/dev/null || true
    - ls -lh releases/linux/
  artifacts:
    name: "mantis-desktop-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - releases/linux/*.AppImage
      - releases/linux/*.deb
    expire_in: 30 days

package:desktop:macos:
  extends: .package_desktop_base
  tags: [macos, darwin, shell]
  needs:
    - job: build:macos
      artifacts: false
  script:
    - cd desktop
    - npm install --no-audit --no-fund
    - npm run dist:mac
    - cd ..
    - mkdir -p releases/macos
    - mv desktop/dist/*.dmg releases/macos/
    - ls -lh releases/macos/
  artifacts:
    name: "mantis-desktop-macos-$CI_COMMIT_SHORT_SHA"
    paths:
      - releases/macos/*.dmg
    expire_in: 30 days

# ─── deploy ─────────────────────────────────────────────────────────────────
# Collect every package job's artifacts and drop them on the SMB share at
# \\$SMB_HOST\$SMB_SHARE\mantis\$CI_COMMIT_REF_SLUG\ — pattern matches the
# Tachyon pipeline. Runs only on master/main, tags, or manual web triggers.
# Lives on the Windows runner because PowerShell's New-PSDrive is the cleanest
# SMB-mount flow we have.

deploy:
  stage: deploy
  tags: [windows, win10, shell]
  # `package:desktop:linux` is intentionally NOT in needs — the debian
  # runner's restricted egress means it routinely hangs until the manual
  # bootstrap pipeline has been played to seed ~/.cache/electron. Listing
  # it here would block deploy on every pipeline. After the cache is
  # populated, re-add it (then desktop:linux finishes in ~30s).
  needs:
    - job: package:cli:windows
      artifacts: true
    - job: package:cli:linux
      artifacts: true
    - job: package:cli:macos
      artifacts: true
    - job: package:desktop:windows
      artifacts: true
    - job: package:desktop:macos
      artifacts: true
  variables:
    DEST_SUBDIR: '$CI_PROJECT_NAME/$CI_COMMIT_REF_SLUG'
  script:
    - |
      if (-not $env:SMB_HOST -or -not $env:SMB_SHARE -or -not $env:SMB_USER -or -not $env:SMB_PASSWORD) {
        Write-Error "Missing SMB_HOST/SMB_SHARE/SMB_USER/SMB_PASSWORD CI vars. Set them in Project Settings → CI/CD → Variables."
        exit 1
      }
      $cred = New-Object System.Management.Automation.PSCredential(
                "$env:SMB_USER",
                (ConvertTo-SecureString "$env:SMB_PASSWORD" -AsPlainText -Force))
      New-PSDrive -Name R -PSProvider FileSystem `
                  -Root "\\$env:SMB_HOST\$env:SMB_SHARE" `
                  -Credential $cred -ErrorAction Stop | Out-Null
      $target = "R:\$env:DEST_SUBDIR"
      New-Item -ItemType Directory -Force -Path $target | Out-Null
      # Layout mirrors `releases/` from the package jobs.
      Copy-Item -Recurse -Force releases/* "$target/"
      "Deployed to \\$env:SMB_HOST\$env:SMB_SHARE\$env:DEST_SUBDIR"
      Get-ChildItem -Recurse "$target" | Select-Object FullName, Length
      Remove-PSDrive -Name R
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
